# LiteLLM Gateway — IACC AI POC
#
# Define alias de modelos usados por todos los POCs.
# Para cambiar el modelo real: edita aquí y reinicia el contenedor.
# El código nunca cambia — siempre usa el alias.

model_list:

  # Alias principal: agente RAG + guardrails (POC 4, 7, 8)
  - model_name: agente-iacc
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  # Alias juez evaluador (POC 5, 6)
  - model_name: juez-iacc
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  # Alias RAG queries (rag/query.js)
  - model_name: rag-iacc
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/LITELLM_DATABASE_URL

  # Logging hacia Langfuse (observabilidad unificada)
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]

litellm_settings:
  # Variables de Langfuse para el callback
  langfuse_public_key: os.environ/LANGFUSE_PUBLIC_KEY
  langfuse_secret_key: os.environ/LANGFUSE_SECRET_KEY
  langfuse_host: os.environ/LANGFUSE_BASE_URL
